[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpa-force-predict"
version = "0.1.0"
description = "Image-only tactile force regression on T-Rex"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["trex_force*"]

[project.scripts]
sharpa-force = "trex_force.__main__:main"
